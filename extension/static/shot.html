<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="shot.css">
</head>
<body>
  <header class="bar">
    <div class="grow">
      <div id="title" class="title">Screenshot</div>
      <div id="meta" class="caption"></div>
    </div>
    <div class="tools" role="toolbar" aria-label="Markup">
      <div class="segmented">
        <button id="pen" aria-pressed="true">Pen</button>
        <button id="box" aria-pressed="false">Box</button>
      </div>
      <button id="undo" disabled>Undo</button>
    </div>
    <div class="tools">
      <button id="copy">Copy</button>
      <button id="save" class="primary">Save</button>
    </div>
  </header>
  <p id="status" class="caption status" role="status"></p>
  <main class="stage"><canvas id="canvas" aria-label="Screenshot"></canvas></main>
  <script type="module" src="ui/shot.js"></script>
</body>
</html>
