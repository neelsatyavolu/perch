<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Accept-only banner</title></head>
<body>
  <!-- A Cookiebot-style dialog whose only control accepts: Perch must leave it alone. -->
  <div id="CybotCookiebotDialog" style="position: fixed; bottom: 0; padding: 16px; background: #fff">
    <p>This site uses cookies.</p>
    <button id="CybotCookiebotDialogBodyButtonDecline" class="looks-like-decline">Allow all</button>
    <button id="CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll">OK</button>
  </div>
  <script>
    window.consent = null;
    for (const b of document.querySelectorAll("button")) b.onclick = () => (window.consent = "accepted");
  </script>
</body>
</html>
