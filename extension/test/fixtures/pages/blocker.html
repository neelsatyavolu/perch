<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Blocker fixture</title></head>
<body>
  <h1>News</h1>
  <script>
    // Each script records whether it loaded. Hosts share this server's port.
    window.results = {};
    const base = (host) => `${location.protocol}//${host}:${location.port}`;
    const sources = {
      ad: base("ads.localhost") + "/ad.js",
      allowed: base("ads.localhost") + "/allowed.js",
      bannerAd: base("site.localhost") + "/static/banner-ad.js",
      tracker: base("tracker.localhost") + "/t.js",
      app: base("site.localhost") + "/app.js",
    };
    window.done = Promise.all(Object.entries(sources).map(([name, src]) => new Promise((resolve) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = () => { results[name] = "loaded"; resolve(); };
      s.onerror = () => { results[name] = "blocked"; resolve(); };
      document.head.append(s);
    }))).then(() => results);
  </script>
</body>
</html>
