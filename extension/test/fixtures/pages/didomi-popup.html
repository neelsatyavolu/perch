<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Didomi fixture, preferences only</title>
<style>#didomi-notice, #didomi-popup { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: #fff; border-top: 1px solid #ccc; }</style>
</head>
<body>
  <h1>Magazine</h1>
  <script>
    // Didomi with no first-layer disagree: Learn more opens the preferences popup, which has
    // "Disagree to all", "Agree to all" and "Save".
    window.consent = null;
    let state = "";
    setTimeout(() => {
      const host = document.createElement("div");
      host.id = "didomi-host";
      host.innerHTML = `
        <div id="didomi-notice" role="region" aria-label="Cookie notice">
          <button id="didomi-notice-learn-more-button">Manage options</button>
          <button id="didomi-notice-agree-button">Agree and close</button>
        </div>`;
      document.body.append(host);
      document.getElementById("didomi-notice-agree-button").onclick = () => { window.consent = "accepted"; };
      document.getElementById("didomi-notice-learn-more-button").onclick = () => {
        document.getElementById("didomi-notice").remove();
        const popup = document.createElement("div");
        popup.id = "didomi-popup";
        popup.innerHTML = `
          <button class="didomi-components-button">Disagree to all</button>
          <button class="didomi-components-button">Agree to all</button>
          <button class="didomi-components-button">Save</button>`;
        host.append(popup);
        const [disagree, agree, save] = popup.querySelectorAll("button");
        disagree.onclick = () => { state = "disagreed"; };
        agree.onclick = () => { state = "agreed"; };
        save.onclick = () => { window.consent = `saved:${state}`; popup.remove(); };
      };
    }, 300);
  </script>
</body>
</html>
