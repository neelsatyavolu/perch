<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Didomi fixture</title>
<style>#didomi-notice { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: #fff; border-top: 1px solid #ccc; }</style>
</head>
<body>
  <h1>Magazine</h1>
  <script>
    // Markup follows Didomi's notice: Agree and close, Disagree and close, Learn more.
    window.consent = null;
    setTimeout(() => {
      const host = document.createElement("div");
      host.id = "didomi-host";
      host.innerHTML = `
        <div id="didomi-notice" class="didomi-popup-notice didomi-notice-banner" role="region" aria-label="Cookie notice">
          <div class="didomi-notice-text">We and our partners use cookies.</div>
          <button id="didomi-notice-learn-more-button" class="didomi-components-button">Learn more</button>
          <button id="didomi-notice-disagree-button" class="didomi-components-button">Disagree and close</button>
          <button id="didomi-notice-agree-button" class="didomi-components-button">Agree and close</button>
        </div>`;
      document.body.append(host);
      const close = (value) => { window.consent = value; document.getElementById("didomi-notice").remove(); };
      document.getElementById("didomi-notice-agree-button").onclick = () => close("accepted");
      document.getElementById("didomi-notice-disagree-button").onclick = () => close("disagreed");
    }, 300);
  </script>
</body>
</html>
