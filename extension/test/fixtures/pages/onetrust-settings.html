<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>OneTrust without a reject button</title>
<style>#onetrust-pc-sdk { display: none; } #onetrust-pc-sdk.open { display: block; }</style>
</head>
<body>
  <div id="onetrust-consent-sdk">
    <div id="onetrust-banner-sdk">
      <p>We and our partners use cookies.</p>
      <button id="onetrust-pc-btn-handler">Manage Preferences</button>
      <button id="onetrust-accept-btn-handler">Accept All</button>
    </div>
    <div id="onetrust-pc-sdk" role="dialog">
      <label><input type="checkbox" checked disabled> Strictly necessary</label>
      <label><input type="checkbox" name="performance" checked> Performance</label>
      <label><input type="checkbox" name="targeting" checked> Targeting</label>
      <button class="save-preference-btn-handler">Confirm My Choices</button>
    </div>
  </div>
  <script>
    window.consent = null;
    const banner = document.getElementById("onetrust-banner-sdk");
    const prefs = document.getElementById("onetrust-pc-sdk");
    document.getElementById("onetrust-pc-btn-handler").onclick = () => prefs.classList.add("open");
    document.getElementById("onetrust-accept-btn-handler").onclick = () => { window.consent = "accepted"; banner.remove(); };
    document.querySelector(".save-preference-btn-handler").onclick = () => {
      window.consent = "saved:" + [...prefs.querySelectorAll("input[name]:checked")].map((i) => i.name).join(",");
      banner.remove();
      prefs.classList.remove("open");
    };
  </script>
</body>
</html>
