<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Quantcast fixture</title>
<style>.view { display: none; } .view.open { display: block; } .qc-cmp2-container { position: fixed; bottom: 0; padding: 16px; background: #fff; }</style>
</head>
<body>
  <div class="qc-cmp2-container" id="qc-cmp2-container">
    <div class="view open" id="summary">
      <p>We value your privacy</p>
      <div class="qc-cmp2-summary-buttons">
        <button mode="secondary">MORE OPTIONS</button>
        <button mode="primary">AGREE</button>
      </div>
    </div>
    <div class="view" id="purposes">
      <label><input type="checkbox" name="ads" checked> Personalised ads</label>
      <div class="qc-cmp2-header-links"><button>REJECT ALL</button><button>ACCEPT ALL</button></div>
      <div class="qc-cmp2-footer"><button>SAVE &amp; EXIT</button></div>
    </div>
  </div>
  <script>
    // Quantcast's first layer here has no reject button, only More options and Agree.
    window.consent = null;
    const [more, agree] = document.querySelectorAll(".qc-cmp2-summary-buttons button");
    const [rejectAll, acceptAll] = document.querySelectorAll(".qc-cmp2-header-links button");
    const box = document.querySelector("input[name=ads]");
    more.onclick = () => { summary.classList.remove("open"); purposes.classList.add("open"); };
    agree.onclick = () => (window.consent = "accepted");
    acceptAll.onclick = () => (box.checked = true);
    rejectAll.onclick = () => (box.checked = false);
    document.querySelector(".qc-cmp2-footer button").onclick = () => {
      window.consent = box.checked ? "saved:ads" : "saved:none";
      document.getElementById("qc-cmp2-container").remove();
    };
  </script>
</body>
</html>
