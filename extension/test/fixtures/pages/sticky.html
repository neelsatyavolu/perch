<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sticky page</title>
<style>
  html, body { margin: 0; background: rgb(255, 255, 255); }
  nav { position: sticky; top: 0; height: 40px; background: rgb(0, 160, 0); }
  .spacer { height: 1160px; }
  section { height: 800px; }
  .note { position: sticky; top: 60px; height: 100px; background: rgb(240, 140, 0); }
  .tail { height: 1000px; }
</style></head>
<body>
  <nav></nav>
  <div class="spacer"></div>
  <section><div class="note" style="top: 60px"></div></section>
  <div class="tail"></div>
</body>
</html>
