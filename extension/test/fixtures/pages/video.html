<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Video</title></head>
<body>
  <video id="v" src="clip.webm" width="640" height="360" muted loop playsinline></video>
  <input id="field" type="text" aria-label="Notes">
  <script>
    const v = document.getElementById("v");
    window.playVideo = () => v.play().then(() => true, (e) => String(e));
    window.pipLog = [];
    v.addEventListener("enterpictureinpicture", () => pipLog.push("enter"));
    v.addEventListener("leavepictureinpicture", () => pipLog.push("leave"));
  </script>
</body>
</html>
