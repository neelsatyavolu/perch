<!doctype html>
<html><head><meta charset="utf-8"><title>Booking</title>
<style>body{font:14px system-ui;padding:16px}label{display:block;margin:8px 0}.box{display:inline-flex;border:1px solid #888;padding:2px}.box input{border:0}</style></head>
<body>
<h1>Booking</h1>
<label>Size <select id="size"><option value="s">Small</option><option value="m">Medium</option><option value="l" disabled>Large</option></select></label>
<label>Departure <input id="depart" readonly placeholder="Pick a date"></label>
<label>Locked <input id="locked" disabled></label>
<div class="box" role="combobox" aria-label="City" aria-expanded="false"><input id="city" aria-autocomplete="list"></div>
<div class="box" role="combobox" aria-label="Code"><input id="code" type="password" maxlength="4"></div>
<label>Phone <input id="phone"></label>
<label>Zip <input id="zip" maxlength="5"></label>
<label>Note <span id="note-wrap"><input id="note"></span></label>
<div id="message" contenteditable="true" role="textbox" aria-label="Message" style="border:1px solid #888;min-height:2em"><p>Old draft</p></div>
<button id="save" disabled>Save</button>
<button id="go">Go</button>
<p id="status" role="status"></p>
<p id="loading">Loading results</p>
<nav id="panel" aria-label="Folders" style="position:fixed;right:0;bottom:0;width:150px;height:80px;overflow:auto"></nav>
<script>
const status = (t) => { document.getElementById('status').textContent = t; };
document.getElementById('size').onchange = (e) => status('Size: ' + e.target.value);
document.getElementById('save').onclick = () => status('Saved');
document.getElementById('go').onclick = () => status('Went');
document.getElementById('city').oninput = (e) => status('City: ' + e.target.value);
document.getElementById('phone').oninput = (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 10); e.target.value = d.length > 6 ? '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6) : d; };
for (let i = 1; i <= 30; i++) document.getElementById('panel').insertAdjacentHTML('beforeend', '<a href="#f' + i + '" style="display:block">Folder ' + i + '</a>');
setTimeout(() => document.getElementById('loading').remove(), 400);
</script>
</body></html>
