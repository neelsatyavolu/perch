<!doctype html>
<html><head><meta charset="utf-8"><title>Long board</title>
<style>
  body { font: 14px system-ui; padding: 16px; }
  #card { width: 120px; padding: 8px; border: 1px solid #888; }
  #zone { width: 200px; height: 80px; border: 2px dashed #888; margin-top: 3000px; }
</style></head>
<body>
<div id="card" draggable="true" role="button" aria-label="Card one">Card one</div>
<div id="zone" role="region" aria-label="Archive column"><button>Archive column</button></div>
<p id="out" role="status"></p>
<script>
document.getElementById('card').addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', 'card-1'));
const zone = document.getElementById('zone');
zone.addEventListener('dragover', (e) => e.preventDefault());
zone.addEventListener('drop', (e) => { e.preventDefault(); document.getElementById('out').textContent = 'Dropped: ' + e.dataTransfer.getData('text/plain'); });
</script>
</body></html>
