<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title>
<style>body{font:14px system-ui;padding:16px}label{display:block;margin:8px 0}#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5)}#overlay.on{display:block}#overlay div{background:#fff;margin:80px auto;width:200px;padding:16px}</style></head>
<body>
<h1>Sign in</h1>
<label>Email <input id="email" type="email" autocomplete="email"></label>
<label>Password <input id="password" type="password" autocomplete="current-password"></label>
<label>Code <input id="otp" inputmode="numeric" autocomplete="one-time-code"></label>
<label>Card number <input id="card" autocomplete="cc-number"></label>
<label>Country <select id="country"><option value="us">United States</option><option value="ca">Canada</option><option value="in">India</option></select></label>
<label><input id="remember" type="checkbox"> Remember me</label>
<button id="signin">Sign in</button>
<button id="notice">Show notice</button>
<p id="status" role="status"></p>
<div id="overlay"><div role="dialog" aria-label="Notice">Cookies help us. <button id="dismiss">Dismiss</button></div></div>
<script>
document.getElementById('country').onchange = (e) => { document.getElementById('status').textContent = 'Country: ' + e.target.value; };
document.getElementById('notice').onclick = () => document.getElementById('overlay').classList.add('on');
document.getElementById('dismiss').onclick = () => document.getElementById('overlay').classList.remove('on');
document.getElementById('signin').onclick = () => { document.getElementById('status').textContent = 'Signed in'; };
</script>
</body></html>
