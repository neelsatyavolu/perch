<!doctype html>
<title>Resume upload</title>
<style>.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }</style>
<form>
  <div class="field">
    <span>Resume</span>
    <button type="button" id="pick">Upload file</button>
    <input id="resume" type="file" class="visually-hidden" tabindex="-1">
  </div>
  <div class="field">
    <span>Cover letter</span>
    <button type="button" id="pick2">Upload file</button>
    <input id="letter" type="file" style="display:none">
  </div>
  <button type="button" id="plain">Not an upload</button>
</form>
<script>
  document.getElementById('pick').onclick = () => document.getElementById('resume').click();
  document.getElementById('pick2').onclick = () => document.getElementById('letter').click();
</script>
