<!doctype html>
<html><head><meta charset="utf-8"><title>Orders</title></head>
<body style="font:14px system-ui">
<h1>All orders</h1>
<table id="t"><thead><tr><th>Order</th><th>Total</th><th>Details</th></tr></thead><tbody></tbody></table>
<script>
const rows = [];
for (let i = 1; i <= 10000; i++) rows.push('<tr><td>#' + (100000 + i) + '</td><td>$' + (i % 97 + 3).toFixed(2) + '</td><td><a href="#o' + i + '">View order ' + i + '</a></td></tr>');
document.querySelector('#t tbody').innerHTML = rows.join('');
</script>
</body></html>
