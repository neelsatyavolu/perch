[project]
name = "perchtools"
version = "0.1.0"
description = "Build tooling for the Perch browser"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
perch-build = "perchtools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/perchtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.hatch.build]
dev-mode-dirs = ["tools"]
